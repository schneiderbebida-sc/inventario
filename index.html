<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Inventário Mobile</title>

<script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f4f4f4;
}

.container {
  background: white;
  padding: 20px;
  margin: 20px;
  border-radius: 10px;
}

#reader {
  width: 300px;
  margin: auto;
}

input, button {
  padding: 12px;
  margin: 8px;
  width: 85%;
  font-size: 16px;
}

button {
  cursor: pointer;
}

.lista {
  text-align: left;
  max-height: 200px;
  overflow-y: auto;
  margin-top: 10px;
}
</style>
</head>

<body>

<h2>📦 Inventário via Celular</h2>

<div class="container">

  <div id="reader"></div>

  <input type="text" id="codigo" placeholder="Código" readonly>
  <input type="text" id="descricao" placeholder="Descrição" readonly>
  <input type="number" id="quantidade" placeholder="Quantidade">

  <button onclick="adicionar()">➕ Adicionar</button>
  <button onclick="exportar()">📤 Exportar Excel</button>

  <div class="lista" id="lista"></div>

</div>

<script>

// 🔹 BASE DE PRODUTOS (você pode expandir)
const produtos = {
  "7894900030013": "FANTA LARANJA 350ML",
  "7894900700015": "COCA 0 LT 350ML",
  "7894900701517": "COCA 0 2L",
  "7896336002862": "AMENDOIM CROKISSIMO 90G",
  "040232885501": "PITEIRA BEM BOLADO SLIM",
  "631430183102": "APERITIVO HAMBRE ITALIANO 750ML"
};

let inventario = [];
let ultimoCodigo = null;

// 🔊 Beep simples
function beep() {
  let ctx = new (window.AudioContext || window.webkitAudioContext)();
  let oscillator = ctx.createOscillator();
  oscillator.type = "beep";
  oscillator.connect(ctx.destination);
  oscillator.start();
  setTimeout(() => oscillator.stop(), 100);
}

// 📳 Vibração
function vibrar() {
  if (navigator.vibrate) {
    navigator.vibrate(100);
  }
}

// 📷 Scanner
function iniciarScanner() {
  Quagga.init({
    inputStream: {
      type: "LiveStream",
      target: document.querySelector('#reader'),
      constraints: {
        facingMode: "environment"
      }
    },
    decoder: {
      readers: ["ean_reader", "ean_13_reader"]
    }
  }, function(err) {
    if (err) {
      console.error(err);
      alert("Erro ao iniciar câmera");
      return;
    }
    Quagga.start();
  });

  Quagga.onDetected(function(result) {
    let codigo = result.codeResult.code;

    // Evita leitura duplicada contínua
    if (codigo === ultimoCodigo) return;
    ultimoCodigo = codigo;

    document.getElementById("codigo").value = codigo;

    if (produtos[codigo]) {
      document.getElementById("descricao").value = produtos[codigo];
    } else {
      document.getElementById("descricao").value = "Produto não encontrado";
    }

    beep();
    vibrar();
  });
}

iniciarScanner();

// ➕ Adicionar item
function adicionar() {
  let codigo = document.getElementById("codigo").value;
  let descricao = document.getElementById("descricao").value;
  let quantidade = document.getElementById("quantidade").value;

  if (!codigo || !quantidade) {
    alert("Preencha os dados!");
    return;
  }

  inventario.push({
    Codigo: codigo,
    Descricao: descricao,
    Quantidade: quantidade
  });

  atualizarLista();

  document.getElementById("quantidade").value = "";
}

// 📋 Atualizar lista na tela
function atualizarLista() {
  let html = "";

  inventario.forEach(item => {
    html += `<div>${item.Codigo} - ${item.Descricao} | Qtd: ${item.Quantidade}</div>`;
  });

  document.getElementById("lista").innerHTML = html;
}

// 📤 Exportar Excel
function exportar() {
  if (inventario.length === 0) {
    alert("Nada para exportar!");
    return;
  }

  let ws = XLSX.utils.json_to_sheet(inventario);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Inventario");

  XLSX.writeFile(wb, "inventario.xlsx");
}

</script>

</body>
</html>
