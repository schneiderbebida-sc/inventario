<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Inventário Mobile PRO</title>

<script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #f4f4f4;
  text-align: center;
}

.container {
  background: #fff;
  margin: 20px;
  padding: 20px;
  border-radius: 10px;
}

input, button {
  padding: 12px;
  margin: 8px;
  width: 90%;
  font-size: 16px;
}

#reader {
  width: 300px;
  margin: auto;
  display: none;
}

.resultado-item {
  padding: 10px;
  border-bottom: 1px solid #ddd;
  cursor: pointer;
  text-align: left;
}

.resultado-item:hover {
  background: #eee;
}

.lista {
  text-align: left;
  max-height: 200px;
  overflow-y: auto;
}
</style>
</head>

<body>

<h2>📦 Inventário Mobile PRO</h2>

<div class="container">

  <input type="text" id="busca" placeholder="Buscar produto..." oninput="buscar()">
  <div id="resultados"></div>

  <button onclick="abrirCamera()">📷 Ler Código de Barras</button>

  <div id="reader"></div>

  <input type="text" id="codigo" placeholder="Código" readonly>
  <input type="text" id="barras" placeholder="Código de Barras" readonly>
  <input type="text" id="descricao" placeholder="Descrição" readonly>
  <input type="number" id="quantidade" placeholder="Quantidade">

  <button onclick="adicionar()">➕ Adicionar</button>
  <button onclick="exportar()">📤 Exportar Excel</button>

  <div class="lista" id="lista"></div>

</div>

<script>

// BASE DE PRODUTOS
const produtos = [
  { codigo: "0000", barras: "7894900030013", descricao: "FANTA LARANJA 350ML" },
  { codigo: "00000", barras: "7894900700015", descricao: "COCA 0 LT 350ML" },
  { codigo: "00002", barras: "7894900701517", descricao: "COCA 0 2L" },
  { codigo: "01059", barras: "7896336002862", descricao: "AMENDOIM CROKISSIMO 90G" },
  { codigo: "040232885501", barras: "040232885501", descricao: "PITEIRA BEM BOLADO SLIM" },
  { codigo: "049", barras: "631430183102", descricao: "APERITIVO HAMBRE ITALIANO 750ML" }
];

let inventario = [];
let scannerAtivo = false;
let ultimoCodigo = null;

// 🔎 BUSCA INTELIGENTE (CORRIGIDA)
function buscar() {
  let termo = document.getElementById("busca").value.toLowerCase().trim();

  if (!termo) {
    document.getElementById("resultados").innerHTML = "";
    return;
  }

  let resultados = produtos.filter(p => {
    let codigo = (p.codigo || "").toString().toLowerCase();
    let barras = (p.barras || "").toString();
    let descricao = (p.descricao || "").toLowerCase();

    return (
      codigo.includes(termo) ||
      barras.includes(termo) ||
      descricao.includes(termo)
    );
  });

  resultados.sort((a, b) => a.descricao.localeCompare(b.descricao));

  let html = "";

  resultados.forEach(p => {
    html += `
      <div class="resultado-item" onclick="selecionarProduto('${p.codigo}')">
        <strong>${p.descricao}</strong><br>
        Cod: ${p.codigo} | Barras: ${p.barras || '-'}
      </div>
    `;
  });

  document.getElementById("resultados").innerHTML = html;
}

// 🎯 SELECIONAR PRODUTO
function selecionarProduto(codigo) {
  let p = produtos.find(x => x.codigo === codigo);

  if (!p) return;

  document.getElementById("codigo").value = p.codigo;
  document.getElementById("barras").value = p.barras;
  document.getElementById("descricao").value = p.descricao;

  document.getElementById("resultados").innerHTML = "";
  document.getElementById("busca").value = "";
}

// 📷 SCANNER
function abrirCamera() {
  if (scannerAtivo) return;

  document.getElementById("reader").style.display = "block";

  Quagga.init({
    inputStream: {
      type: "LiveStream",
      target: document.querySelector('#reader'),
      constraints: { facingMode: "environment" }
    },
    decoder: {
      readers: ["ean_reader", "ean_13_reader"]
    }
  }, function(err) {
    if (err) {
      alert("Erro ao abrir câmera");
      return;
    }
    Quagga.start();
    scannerAtivo = true;
  });

  Quagga.onDetected(function(result) {
    let codigo = result.codeResult.code;

    if (codigo === ultimoCodigo) return;
    ultimoCodigo = codigo;

    let produto = produtos.find(p => p.barras === codigo);

    if (produto) {
      selecionarProduto(produto.codigo);
      vibrar();
      pararCamera();
    } else {
      alert("Produto não encontrado");
    }
  });
}

// 🛑 PARAR CÂMERA
function pararCamera() {
  Quagga.stop();
  document.getElementById("reader").style.display = "none";
  scannerAtivo = false;
}

// 📳 VIBRAÇÃO
function vibrar() {
  if (navigator.vibrate) navigator.vibrate(100);
}

// ➕ ADICIONAR COM SOMA
function adicionar() {
  let codigo = document.getElementById("codigo").value;
  let descricao = document.getElementById("descricao").value;
  let quantidade = parseInt(document.getElementById("quantidade").value);

  if (!codigo || !quantidade) {
    alert("Preencha os dados!");
    return;
  }

  let existente = inventario.find(i => i.Codigo === codigo);

  if (existente) {
    existente.Quantidade += quantidade;
  } else {
    inventario.push({
      Codigo: codigo,
      Descricao: descricao,
      Quantidade: quantidade
    });
  }

  atualizarLista();
  document.getElementById("quantidade").value = "";
}

// 📋 LISTA
function atualizarLista() {
  let html = "";

  inventario.forEach(item => {
    html += `<div>${item.Codigo} - ${item.Descricao} | Qtd: ${item.Quantidade}</div>`;
  });

  document.getElementById("lista").innerHTML = html;
}

// 📤 EXPORTAR
function exportar() {
  if (inventario.length === 0) {
    alert("Nada para exportar!");
    return;
  }

  let ws = XLSX.utils.json_to_sheet(inventario);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Inventario");

  XLSX.writeFile(wb, "inventario.xlsx");
}

</script>

</body>
</html>
